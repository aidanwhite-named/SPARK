<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SPARK 특허 신규성·진보성 분석</title>
    <link rel="icon" href="/static/spark-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div class="brand">
            <img class="brand-mark" src="/static/spark-logo.svg" alt="SPARK" />
            <div>
              <h1>SPARK</h1>
              <p class="brand-full">Semantic Patent Analysis &amp; Reasoning Kernel</p>
              <p>인용발명 PDF와 청구항 1을 넣으면 STEP 1-3 분석을 순차 실행합니다.</p>
            </div>
          </div>
          <div class="topbar-side">
            <div class="status-pill" id="statusPill">대기</div>
            <p class="rights">All rights reserved by AIdan</p>
          </div>
        </header>

        <form id="analysisForm" class="panel">
          <div class="grid">
            <label class="field wide">
              <span>청구항 1</span>
              <textarea name="claim" rows="12" placeholder="청구항 1 전문을 붙여넣으세요." required></textarea>
            </label>

            <label class="field upload">
              <span>인용발명 PDF</span>
              <input name="references" type="file" accept="application/pdf,.pdf" multiple required />
              <small>1개 이상 업로드할 수 있습니다. STEP 1에서 주 인용발명과 보조 인용발명을 자동 선정합니다.</small>
            </label>
          </div>

          <details class="settings">
            <summary>AI 및 agent 모델 설정</summary>
            <div class="settings-grid">
              <label class="field">
                <span>AI CLI</span>
                <select name="ai_provider" id="aiProvider">
                  {% for key, provider in ai_providers.items() %}
                    <option value="{{ key }}" {% if defaults.ai_provider == key %}selected{% endif %}>{{ provider.label }}</option>
                  {% endfor %}
                </select>
              </label>
              <label class="field">
                <span>agent 모델</span>
                <select id="modelPreset"></select>
              </label>
              <label class="field" style="display: none;">
                <span>실행 파일</span>
                <input name="cli_executable" id="cliExecutable" value="{{ defaults.cli_executable }}" />
              </label>
              <label class="field" style="display: none;">
                <span>프롬프트 옵션</span>
                <input name="prompt_option" value="{{ defaults.prompt_option }}" />
              </label>
              <label class="field wide-setting" style="display: none;">
                <span>직접 입력 모델명</span>
                <input name="model" id="modelInput" value="{{ defaults.model }}" placeholder="프리셋 선택 또는 직접 입력" />
              </label>
              <label class="field">
                <span>단계별 제한 시간(초)</span>
                <input name="timeout" type="number" min="60" value="{{ defaults.timeout }}" />
              </label>
            </div>
            <input type="hidden" name="prompt_title" value="" />
          </details>

          <div class="actions">
            <button type="submit" id="runButton">분석 시작</button>
          </div>
        </form>

        <section class="progress panel">
          <div class="progress-head">
            <h2>진행 상태</h2>
            <span id="jobId"></span>
          </div>
          <ol class="steps">
            <li id="s1">STEP 1 인용발명 선정</li>
            <li id="s2">STEP 2 구성요소 대비</li>
            <li id="s3">STEP 3 신규성·진보성 판단</li>
          </ol>
          <p id="message">입력 후 분석을 시작하세요.</p>
          <div class="artifacts" id="artifacts"></div>
        </section>

        <section class="history panel">
          <div class="history-head">
            <h2>보고서 히스토리</h2>
            <div class="history-actions">
              <button type="button" class="secondary-button" id="refreshHistory">새로고침</button>
              <button type="button" class="secondary-button" id="clearHistoryList">목록만 비우기</button>
              <button type="button" class="danger-button" id="clearHistoryServer">서버 기록 삭제</button>
            </div>
          </div>
          <div class="history-layout">
            <div class="history-list" id="historyList"></div>
            <article class="history-view">
              <div class="history-view-head">
                <h3 id="historyTitle">보고서를 선택하세요</h3>
                <span id="historyMeta"></span>
              </div>
              <div class="result-output history-output" id="historyContent"></div>
            </article>
          </div>
        </section>

        <section class="results">
          <article class="result-card">
            <h2>STEP 1</h2>
            <div class="result-output" id="step1"></div>
          </article>
          <article class="result-card">
            <h2>STEP 2</h2>
            <div class="result-output" id="step2"></div>
          </article>
          <article class="result-card">
            <h2>STEP 3 최종 결과</h2>
            <div class="result-output" id="step3"></div>
          </article>
        </section>
      </section>
    </main>

    <script>
      const form = document.querySelector("#analysisForm");
      const runButton = document.querySelector("#runButton");
      const statusPill = document.querySelector("#statusPill");
      const message = document.querySelector("#message");
      const jobId = document.querySelector("#jobId");
      const aiProviders = {{ ai_providers | tojson }};
      const aiProvider = document.querySelector("#aiProvider");
      const cliExecutable = document.querySelector("#cliExecutable");
      const modelPreset = document.querySelector("#modelPreset");
      const modelInput = document.querySelector("#modelInput");
      const historyList = document.querySelector("#historyList");
      const historyContent = document.querySelector("#historyContent");
      const historyTitle = document.querySelector("#historyTitle");
      const historyMeta = document.querySelector("#historyMeta");
      const stepEls = {
        step1: document.querySelector("#step1"),
        step2: document.querySelector("#step2"),
        step3: document.querySelector("#step3"),
      };
      const artifacts = document.querySelector("#artifacts");

      function syncModelPresets(keepModel = true) {
        const provider = aiProviders[aiProvider.value] || aiProviders.gemini;
        const currentModel = modelInput.value.trim();
        modelPreset.replaceChildren();

        modelPreset.append(new Option("직접 입력", ""));
        provider.models.forEach((model) => modelPreset.append(new Option(model, model)));

        const hasPreset = provider.models.includes(currentModel);
        modelPreset.value = hasPreset ? currentModel : "";
        if (!keepModel && provider.models.length) {
          modelPreset.value = provider.models[0];
          modelInput.value = provider.models[0];
        }
      }

      aiProvider.addEventListener("change", () => {
        const provider = aiProviders[aiProvider.value] || aiProviders.gemini;
        cliExecutable.value = provider.executable;
        syncModelPresets(false);
      });

      modelPreset.addEventListener("change", () => {
        if (modelPreset.value) modelInput.value = modelPreset.value;
      });

      modelInput.addEventListener("input", () => syncModelPresets(true));
      syncModelPresets(true);

      function setStatus(text, kind = "") {
        statusPill.textContent = text;
        statusPill.className = `status-pill ${kind}`;
      }

      function markProgress(msg) {
        document.querySelectorAll(".steps li").forEach((el) => el.classList.remove("active", "done"));
        if (msg.includes("STEP 1")) document.querySelector("#s1").classList.add("active");
        if (msg.includes("STEP 2")) {
          document.querySelector("#s1").classList.add("done");
          document.querySelector("#s2").classList.add("active");
        }
        if (msg.includes("STEP 3")) {
          document.querySelector("#s1").classList.add("done");
          document.querySelector("#s2").classList.add("done");
          document.querySelector("#s3").classList.add("active");
        }
        if (msg.includes("완료")) {
          document.querySelectorAll(".steps li").forEach((el) => el.classList.add("done"));
        }
      }

      async function poll(id) {
        const response = await fetch(`/jobs/${id}`);
        const data = await response.json();
        message.textContent = data.error || data.message;
        markProgress(data.message || "");
        renderArtifacts(data.artifacts || [], data.output_file);

        for (const key of Object.keys(stepEls)) {
          if (data.results && data.results[key]) stepEls[key].innerHTML = renderResult(data.results[key]);
        }

        if (data.status === "done") {
          setStatus("완료", "ok");
          runButton.disabled = false;
          await loadHistory();
          return;
        }
        if (data.status === "error") {
          setStatus("오류", "error");
          runButton.disabled = false;
          return;
        }
        setTimeout(() => poll(id), 2000);
      }

      function renderArtifacts(items, outputFile) {
        if (!items.length && !outputFile) {
          artifacts.textContent = "";
          return;
        }
        const rows = [];
        if (outputFile) rows.push(`report: ${outputFile}`);
        for (const item of items) {
          rows.push(`${item.name} (${item.bytes.toLocaleString()} bytes)`);
        }
        artifacts.textContent = `구조화 산출물\n${rows.join("\n")}`;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        runButton.disabled = true;
        setStatus("실행 중", "run");
        message.textContent = "작업을 준비 중입니다.";
        Object.values(stepEls).forEach((el) => (el.innerHTML = ""));
        artifacts.textContent = "";

        const response = await fetch("/analyze", {
          method: "POST",
          body: new FormData(form),
        });
        const data = await response.json();
        if (!response.ok) {
          setStatus("오류", "error");
          message.textContent = data.error || "분석을 시작하지 못했습니다.";
          runButton.disabled = false;
          return;
        }
        jobId.textContent = `작업 ID: ${data.job_id}`;
        poll(data.job_id);
      });

      async function loadHistory() {
        const response = await fetch("/history");
        const data = await response.json();
        renderHistoryList(data.items || []);
      }

      function renderHistoryList(items) {
        historyList.replaceChildren();
        if (!items.length) {
          const empty = document.createElement("p");
          empty.className = "history-empty";
          empty.textContent = "표시할 보고서가 없습니다.";
          historyList.append(empty);
          return;
        }

        for (const item of items) {
          const row = document.createElement("article");
          row.className = "history-item";

          const main = document.createElement("button");
          main.type = "button";
          main.className = "history-open";
          main.innerHTML = `
            <strong>${escapeHtml(item.created_at_text)}</strong>
            <span>${escapeHtml(item.claim_preview || "청구항 미리보기 없음")}</span>
            <small>${escapeHtml([item.provider, item.model].filter(Boolean).join(" / ") || "모델 정보 없음")}</small>
          `;
          main.addEventListener("click", () => openHistory(item.id));

          const actions = document.createElement("div");
          actions.className = "history-item-actions";
          const hideButton = document.createElement("button");
          hideButton.type = "button";
          hideButton.className = "secondary-button compact";
          hideButton.textContent = "목록 삭제";
          hideButton.addEventListener("click", () => deleteHistory(item.id, "list"));
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "danger-button compact";
          deleteButton.textContent = "서버 삭제";
          deleteButton.addEventListener("click", () => deleteHistory(item.id, "server"));
          actions.append(hideButton, deleteButton);

          row.append(main, actions);
          historyList.append(row);
        }
      }

      async function openHistory(id) {
        const response = await fetch(`/history/${id}`);
        const data = await response.json();
        if (!response.ok) {
          historyTitle.textContent = "보고서를 열 수 없습니다";
          historyMeta.textContent = data.error || "";
          historyContent.textContent = "";
          return;
        }
        historyTitle.textContent = `보고서 ${data.item.id}`;
        historyMeta.textContent = `${data.item.created_at_text} · ${data.item.bytes.toLocaleString()} bytes`;
        historyContent.innerHTML = renderResult(data.content || "");
      }

      async function deleteHistory(id, scope) {
        const message = scope === "server"
          ? "서버에 저장된 보고서, 업로드 파일, 로그를 삭제할까요?"
          : "히스토리 목록에서만 숨길까요? 서버 파일은 유지됩니다.";
        if (!confirm(message)) return;
        await fetch(`/history/${id}?scope=${scope}`, { method: "DELETE" });
        historyContent.textContent = "";
        historyTitle.textContent = "보고서를 선택하세요";
        historyMeta.textContent = "";
        await loadHistory();
      }

      async function clearHistory(scope) {
        const message = scope === "server"
          ? "모든 서버 저장 기록을 삭제할까요? 보고서, 업로드 파일, 로그가 삭제됩니다."
          : "히스토리 목록만 모두 비울까요? 서버 파일은 유지됩니다.";
        if (!confirm(message)) return;
        await fetch(`/history?scope=${scope}`, { method: "DELETE" });
        historyContent.textContent = "";
        historyTitle.textContent = "보고서를 선택하세요";
        historyMeta.textContent = "";
        await loadHistory();
      }

      document.querySelector("#refreshHistory").addEventListener("click", loadHistory);
      document.querySelector("#clearHistoryList").addEventListener("click", () => clearHistory("list"));
      document.querySelector("#clearHistoryServer").addEventListener("click", () => clearHistory("server"));

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function isTableSeparator(line) {
        return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
      }

      function parseTableRow(line) {
        const trimmed = line.trim();
        if (!trimmed.startsWith("|") || !trimmed.endsWith("|")) return null;
        return trimmed.slice(1, -1).split("|").map((cell) => cell.trim());
      }

      function renderMarkdownTable(lines) {
        const header = parseTableRow(lines[0]) || [];
        const body = lines.slice(2).map(parseTableRow).filter(Boolean);
        const tableClasses = [];
        if (header.length >= 7) tableClasses.push("wide-table");
        if (header.join("|") === "인용발명|문헌명|전체 유사도|핵심 근거") tableClasses.push("reference-table");
        const tableClass = tableClasses.join(" ");
        const thead = `<thead><tr>${header.map((cell) => `<th>${escapeHtml(cell)}</th>`).join("")}</tr></thead>`;
        const tbody = body
          .map((row) => `<tr>${row.map((cell) => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`)
          .join("");
        return `<div class="table-wrap"><table class="${tableClass}">${thead}<tbody>${tbody}</tbody></table></div>`;
      }

      function renderResult(markdown) {
        const lines = markdown.split(/\r?\n/);
        const chunks = [];
        let textBuffer = [];

        function flushText() {
          if (!textBuffer.length) return;
          chunks.push(`<pre class="result-text">${escapeHtml(textBuffer.join("\n"))}</pre>`);
          textBuffer = [];
        }

        for (let i = 0; i < lines.length; i += 1) {
          const row = parseTableRow(lines[i]);
          if (row && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
            const tableLines = [lines[i], lines[i + 1]];
            i += 2;
            while (i < lines.length && parseTableRow(lines[i])) {
              tableLines.push(lines[i]);
              i += 1;
            }
            i -= 1;
            flushText();
            chunks.push(renderMarkdownTable(tableLines));
          } else {
            textBuffer.push(lines[i]);
          }
        }

        flushText();
        return chunks.join("");
      }

      window.renderResult = renderResult;
      loadHistory();
    </script>
  </body>
</html>
